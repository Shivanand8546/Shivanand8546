name: Generate header gif

on:
  workflow_dispatch:
  push:
    paths:
      - 'header-generator/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Record frames and build gif
        working-directory: header-generator
        run: |
          npm install
          node record.js
          ffmpeg -framerate 20 -i frames/f_%04d.png -vf "split[a][b];[a]palettegen=max_colors=128[p];[b][p]paletteuse=dither=bayer" header.gif

      - name: Commit gif
        run: |
          mkdir -p assets
          cp header-generator/header.gif assets/header.gif
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/header.gif
          git commit -m "Update header gif" || exit 0
          git push
