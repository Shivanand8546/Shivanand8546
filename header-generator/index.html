<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#0d1117;overflow:hidden}
  #wrap{position:relative;width:850px;height:300px;background:#0d1117}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Segoe UI,Arial,sans-serif}
  .hi{font-family:Consolas,monospace;font-size:12px;color:#2dd4bf;letter-spacing:2px}
  .name{font-size:42px;font-weight:600;color:#f8fafc;margin:4px 0}
  .role{font-size:15px;color:#94a3b8}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="txt">
    <div class="hi">HELLO, I'M</div>
    <div class="name">Shivanand Shukla</div>
    <div class="role">Full Stack Developer | DevOps Learner | AI Enthusiast</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
var W=850,H=300,T=6;
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H,false);
renderer.setClearColor(0x0d1117,1);
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(50,W/H,0.1,100);
camera.position.z=7;
var group=new THREE.Group();scene.add(group);

var N=1400,pos=new Float32Array(N*3),col=new Float32Array(N*3);
var c1=new THREE.Color('#2dd4bf'),c2=new THREE.Color('#818cf8');
for(var i=0;i<N;i++){
  var y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),t=i*2.399963,R=2.6;
  pos[i*3]=Math.cos(t)*r*R;pos[i*3+1]=y*R;pos[i*3+2]=Math.sin(t)*r*R;
  var c=c1.clone().lerp(c2,(y+1)/2);
  col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
}
var g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(pos,3));
g.setAttribute('color',new THREE.BufferAttribute(col,3));
group.add(new THREE.Points(g,new THREE.PointsMaterial({size:0.035,vertexColors:true,transparent:true,opacity:0.85})));

var ico=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1),new THREE.MeshBasicMaterial({color:0x2dd4bf,wireframe:true,transparent:true,opacity:0.18}));
group.add(ico);
var ring1=new THREE.Mesh(new THREE.TorusGeometry(3.4,0.008,8,160),new THREE.MeshBasicMaterial({color:0x818cf8,transparent:true,opacity:0.6}));
ring1.rotation.x=Math.PI/2.4;scene.add(ring1);
var ring2=new THREE.Mesh(new THREE.TorusGeometry(3.9,0.006,8,160),new THREE.MeshBasicMaterial({color:0x2dd4bf,transparent:true,opacity:0.4}));
ring2.rotation.x=Math.PI/1.9;ring2.rotation.y=0.5;scene.add(ring2);

window.setTime=function(t){
  var a=(t/T)*Math.PI*2;
  group.rotation.y=a;
  ico.rotation.y=-a;
  ring1.rotation.z=a;
  ring2.rotation.z=-a;
  renderer.render(scene,camera);
};
window.T=T;
if(!location.search.includes('record')){
  var s=performance.now();
  (function loop(){window.setTime(((performance.now()-s)/1000)%T);requestAnimationFrame(loop)})();
}
</script>
</body>
</html>
